x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-good_day_afisha}
      POSTGRES_USER: ${POSTGRES_USER:-good_day}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    logging: *default-logging
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-good_day}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-good_day_afisha}?schema=public
    depends_on:
      database:
        condition: service_healthy
    command: ["pnpm", "prisma", "migrate", "deploy"]

  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: ${ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-good_day}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-good_day_afisha}?schema=public
      NODE_ENV: production
    volumes:
      - ./public/media:/app/public/media
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    image: alpine:3.21
    restart: unless-stopped
    logging: *default-logging
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      app:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          wget -qO- --header="Authorization: Bearer $${CRON_SECRET}" --post-data='' http://app:3000/api/internal/pipeline/run || true
          sleep "$${PIPELINE_INTERVAL_SECONDS:-3600}"
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
